<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under the Mango Tree</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a1208;
      overflow: hidden;
      font-family: 'Georgia', serif;
      color: #f4d8a8;
    }
    #game-container {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #p5-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      z-index: 100;
      background: #000;
    }
    #p5-overlay.active { display: block; }
    #hud {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 200;
    }
    .hud-btn {
      background: rgba(60, 35, 20, 0.92);
      color: #f4d8a8;
      border: 2px solid #8b5a2b;
      padding: 10px 18px;
      font-family: 'Georgia', serif;
      font-size: 15px;
      cursor: pointer;
      pointer-events: auto;
      border-radius: 6px;
      letter-spacing: 1px;
    }
    .hud-btn:hover { background: rgba(80, 50, 30, 0.95); }
    #journal-btn { position: absolute; top: 16px; right: 16px; }
    #exit-scene-btn {
      position: absolute;
      top: 16px; left: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #f4d8a8;
      border: 2px solid #8b5a2b;
      padding: 8px 14px;
      display: none;
      letter-spacing: 1px;
      font-family: 'Georgia', serif;
      font-size: 14px;
      cursor: pointer;
      pointer-events: auto;
      border-radius: 6px;
    }
    #exit-scene-btn.visible { display: block; }
    #journal-panel {
      position: absolute;
      top: 60px; right: 16px;
      background: rgba(40, 25, 15, 0.96);
      border: 2px solid #8b5a2b;
      padding: 20px;
      width: 380px;
      max-height: 70vh;
      overflow-y: auto;
      pointer-events: auto;
      border-radius: 6px;
      display: none;
    }
    #journal-panel.visible { display: block; }
    #journal-panel h2 {
      color: #f4d8a8;
      margin-bottom: 12px;
      font-size: 22px;
      border-bottom: 1px solid #8b5a2b;
      padding-bottom: 8px;
    }
    .journal-entry {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(139, 90, 43, 0.3);
    }
    .journal-entry h3 {
      color: #ffd97a;
      font-size: 16px;
      margin-bottom: 4px;
    }
    .journal-entry .meta {
      font-size: 12px;
      color: #c4a878;
      font-style: italic;
      margin-bottom: 4px;
    }
    .journal-entry .note {
      font-size: 14px;
      color: #e4c898;
      line-height: 1.4;
    }
    .undiscovered { color: #6b5440; font-style: italic; }
    #dialog-box {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 700px;
      background: rgba(40, 25, 15, 0.96);
      border: 3px solid #8b5a2b;
      padding: 18px 24px;
      border-radius: 8px;
      pointer-events: none;
      display: none;
      color: #f4d8a8;
      font-size: 18px;
      line-height: 1.5;
    }
    #dialog-box.visible { display: block; animation: fadeIn 0.3s; }
    #dialog-box .speaker {
      color: #ffd97a;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    #suggest-modal {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(40, 25, 15, 0.98);
      border: 3px solid #8b5a2b;
      padding: 30px;
      border-radius: 10px;
      pointer-events: auto;
      display: none;
      color: #f4d8a8;
      width: 420px;
    }
    #suggest-modal.visible { display: block; }
    #suggest-modal h2 { margin-bottom: 8px; color: #ffd97a; }
    #suggest-modal p { font-size: 13px; color: #c4a878; margin-bottom: 16px; font-style: italic; }
    #suggest-modal input, #suggest-modal textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: rgba(20, 12, 6, 0.8);
      border: 1px solid #8b5a2b;
      color: #f4d8a8;
      font-family: 'Georgia', serif;
      border-radius: 4px;
      font-size: 14px;
    }
    #suggest-modal textarea { min-height: 80px; resize: vertical; }
    #suggest-modal button {
      padding: 10px 20px;
      background: #8b5a2b;
      color: #f4d8a8;
      border: none;
      cursor: pointer;
      font-family: 'Georgia', serif;
      border-radius: 4px;
      margin-right: 8px;
      font-size: 14px;
    }
    #suggest-modal button:hover { background: #a76d35; }
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #1a1208;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: #f4d8a8;
      font-size: 24px;
      letter-spacing: 3px;
      font-style: italic;
    }
    #loading.hidden { display: none; }
    /* Title overlay - shown briefly on first load */
    #title-card {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(20, 12, 6, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      pointer-events: auto;
    }
    #title-card.hidden { display: none; }
    #title-card h1 {
      font-size: 56px;
      color: #ffd97a;
      font-style: italic;
      margin-bottom: 16px;
      text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
    }
    #title-card .subtitle {
      font-size: 18px;
      color: #c4a878;
      font-style: italic;
      margin-bottom: 40px;
    }
    #title-card .begin-btn {
      padding: 14px 40px;
      background: #8b5a2b;
      color: #f4d8a8;
      border: 2px solid #c4a878;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 18px;
      border-radius: 6px;
      letter-spacing: 2px;
    }
    #title-card .begin-btn:hover { background: #a76d35; }
    #title-card .dedication {
      position: absolute;
      bottom: 30px;
      font-size: 13px;
      color: #8b6c50;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="loading">a little patience...</div>

  <div id="title-card" class="hidden">
    <h1>Under the Mango Tree</h1>
    <div class="subtitle">a journey through Caribbean music, beginning in Berbice</div>
    <button class="begin-btn" onclick="closeTitle()">Begin</button>
    <div class="dedication">for grandpa, who was always dancing to the end of his days.</div>
  </div>

  <div id="game-container"></div>
  <div id="p5-overlay"></div>

  <div id="hud">
    <button id="journal-btn" class="hud-btn">📖 journal</button>
    <button id="exit-scene-btn">← back to the yard</button>
    <div id="journal-panel">
      <h2>Songs Discovered</h2>
      <div id="journal-entries"></div>
    </div>
    <div id="dialog-box">
      <div class="speaker" id="dialog-speaker">GRANDPA</div>
      <div id="dialog-text">...</div>
    </div>
    <div id="suggest-modal">
      <h2>Suggest a song</h2>
      <p>Know a song or genre I should add? Leave a note in the mailbox.</p>
      <input id="suggest-name" type="text" placeholder="Your name (optional)" />
      <input id="suggest-song" type="text" placeholder="Song or genre name" />
      <textarea id="suggest-notes" placeholder="Tell me about it..."></textarea>
      <button onclick="submitSuggestion()">Send</button>
      <button onclick="closeSuggest()">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>

  <script src="data.js"></script>
  <script src="scenes/berbice_scene.js"></script>
  <script src="scenes/mango_p5_bridge.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
